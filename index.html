        // 画像圧縮関数
        const compressImg = (file, maxPx = 800) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxPx || h > maxPx) {
                            if (w > h) {
                                h = Math.round((h * maxPx) / w);
                                w = maxPx;
                            } else {
                                w = Math.round((w * maxPx) / h);
                                h = maxPx;
                            }
                        }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        };

        function App() {
            const [castles, setCastles] = useState([]);
            const [filterCategory, setFilterCategory] = useState("ALL");
            const [filterVisited, setFilterVisited] = useState("ALL");
            const [filterRegion, setFilterRegion] = useState("ALL");
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedCastle, setSelectedCastle] = useState(null);
            const [activeTab, setActiveTab] = useState("LIST");
            const [sidebarOpen, setSidebarOpen] = useState(true);

            const mapRef = useRef(null);
            const markersRef = useRef({});

            useEffect(() => {
                const initData = async () => {
                    const count = await db.castles.count();
                    if (count === 0) {
                        const initialRecords = MASTER_CASTLES.map(c => ({
                            ...c,
                            isVisited: false,
                            date: "",
                            memo: "",
                            stampPhoto: null,
                            castlePhoto: null
                        }));
                        await db.castles.bulkAdd(initialRecords);
                    }
                    loadCastles();
                };
                initData();
            }, []);

            const loadCastles = async () => {
                const data = await db.castles.toArray();
                setCastles(data);
            };

            useEffect(() => {
                if (!mapRef.current) {
                    const map = L.map('map-container', { zoomControl: false }).setView([37.8, 137.5], 5);
                    L.control.zoom({ position: 'topright' }).addTo(map);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);
                    mapRef.current = map;
                }
            }, []);

            const filteredCastles = useMemo(() => {
                return castles.filter(c => {
                    if (filterCategory !== "ALL" && c.category !== filterCategory) return false;
                    if (filterVisited === "VISITED" && !c.isVisited) return false;
                    if (filterVisited === "UNVISITED" && c.isVisited) return false;
                    if (filterRegion !== "ALL" && c.region !== filterRegion) return false;
                    if (searchQuery.trim() !== "") {
                        const q = searchQuery.toLowerCase();
                        return c.name.toLowerCase().includes(q) || c.pref.toLowerCase().includes(q) || c.id.toString() === q;
                    }
                    return true;
                });
            }, [castles, filterCategory, filterVisited, filterRegion, searchQuery]);

            useEffect(() => {
                if (!mapRef.current || castles.length === 0) return;
                Object.values(markersRef.current).forEach(m => mapRef.current.removeLayer(m));
                markersRef.current = {};

                filteredCastles.forEach(castle => {
                    const isVisited = castle.isVisited;
                    const is100 = castle.category === "100名城";
                    const pinColor = isVisited ? "#d3381c" : (is100 ? "#1b2a47" : "#5b6b8c");
                    const strokeColor = isVisited ? "#f7f5f0" : "#c5a059";
                    const badgeText = is100 ? "100" : "続";

                    const customIcon = L.divIcon({
                        className: "castle-marker",
                        html: `
                            <div style="position: relative; width: 32px; height: 38px; cursor: pointer;">
                                <svg viewBox="0 0 36 46" width="32" height="38" style="filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));">
                                    <path d="M18 0 C8.06 0 0 8.06 0 18 C0 29.25 18 46 18 46 C18 46 36 29.25 36 18 C36 8.06 27.94 0 18 0 Z" fill="${pinColor}" stroke="${strokeColor}" stroke-width="2"/>
                                    <path d="M11 20 L11 15 L14 15 L14 17 L16 17 L16 13 L20 13 L20 17 L22 17 L22 15 L25 15 L25 20 Z" fill="#ffffff" opacity="0.9"/>
                                </svg>
                                <span style="position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);">${badgeText}</span>
                            </div>
                        `,
                        iconSize: [32, 38],
                        iconAnchor: [16, 38]
                    });

                    const marker = L.marker([castle.lat, castle.lng], { icon: customIcon }).addTo(mapRef.current);
                    marker.on('click', () => setSelectedCastle(castle));
                    markersRef.current[castle.id] = marker;
                });
            }, [filteredCastles, castles]);

            const handleSelectCastle = (castle) => {
                setSelectedCastle(castle);
                if (mapRef.current) {
                    mapRef.current.flyTo([castle.lat, castle.lng], 11, { duration: 1.2 });
                }
            };

            const handleSaveRecord = async (updatedData) => {
                await db.castles.put(updatedData);
                await loadCastles();
                setSelectedCastle(updatedData);
            };

            const handleToggleVisited = async (castle, e) => {
                e.stopPropagation();
                const newVisited = !castle.isVisited;
                const today = newVisited ? new Date().toISOString().split('T')[0] : "";
                const updated = { ...castle, isVisited: newVisited, date: castle.date || today };
                await db.castles.put(updated);
                await loadCastles();
                if (selectedCastle && selectedCastle.id === castle.id) {
                    setSelectedCastle(updated);
                }
            };

            const stats = useMemo(() => {
                const c100 = castles.filter(c => c.category === "100名城");
                const c100V = c100.filter(c => c.isVisited).length;
                const c200 = castles.filter(c => c.category === "続100名城");
                const c200V = c200.filter(c => c.isVisited).length;
                const regions = ["北海道・東北", "関東・甲信越", "東海・北陸", "近畿", "中国・四国", "九州・沖縄"];
                const regionStats = regions.map(reg => {
                    const list = castles.filter(c => c.region === reg);
                    const visited = list.filter(c => c.isVisited).length;
                    return { name: reg, total: list.length, visited };
                });
                return {
                    totalVisited: c100V + c200V,
                    totalAll: castles.length,
                    c100V, c100Total: c100.length,
                    c200V, c200Total: c200.length,
                    regionStats
                };
            }, [castles]);

            const handleExport = async () => {
                const data = await db.castles.toArray();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Japan_100_Castles_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const handleImport = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported) && imported.length > 0) {
                            if (window.confirm("現在のデータを上書き復元しますか？")) {
                                await db.castles.clear();
                                await db.castles.bulkAdd(imported);
                                await loadCastles();
                                alert("データ復元が完了しました！");
                            }
                        } else {
                            alert("無効なバックアップデータです。");
                        }
                    } catch (err) {
                        alert("ファイルの読み込みに失敗しました。");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="w-full h-full flex flex-col relative overflow-hidden">
                    {/* ヘッダー */}
                    <header className="bg-[#1b2a47] text-white px-3 py-2 flex items-center justify-between border-b-2 border-[#c5a059] z-20 shrink-0 shadow-md">
                        <div className="flex items-center space-x-2">
                            <span className="text-xl">🏯</span>
                            <div>
                                <h1 className="font-mincho font-bold text-base leading-tight text-[#f7f5f0]">日本100名城 MAP</h1>
                                <p className="text-[10px] text-[#c5a059]">スタンプラリー & 登城記録</p>
                            </div>
                        </div>
                        <div className="flex items-center space-x-2 text-xs">
                            <div className="bg-[#0f1829] px-2 py-1 rounded border border-[#c5a059]/40 flex items-center space-x-1">
                                <span className="text-gray-300">達成:</span>
                                <span className="font-bold text-[#c5a059] text-xs">
                                    {stats.totalVisited}/{stats.totalAll}
                                </span>
                            </div>
                            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="md:hidden bg-[#c5a059] text-[#1b2a47] px-2 py-1 rounded font-bold text-xs">
                                {sidebarOpen ? "地図優先" : "一覧表示"}
                            </button>
                        </div>
                    </header>

                    {/* メインエリア */}
                    <div className="flex-1 flex flex-col md:flex-row min-h-0 relative overflow-hidden">
                        {/* 地図 */}
                        <div className={`flex-1 relative z-0 ${sidebarOpen ? 'h-[40vh] md:h-full' : 'h-full'}`}>
                            <div id="map-container" className="w-full h-full bg-[#e5e3df]"></div>
                        </div>

                        {/* パネル / リスト */}
                        <div className={`w-full md:w-[400px] bg-[#f7f5f0] flex flex-col border-t-2 md:border-t-0 md:border-l-2 border-[#c5a059] z-10 shadow-xl transition-all ${sidebarOpen ? 'h-[60vh] md:h-full' : 'hidden md:flex md:h-full'} min-h-0`}>
                            <div className="flex bg-[#1b2a47] text-gray-300 text-xs border-b border-[#c5a059]/30 shrink-0">
                                <button onClick={() => setActiveTab("LIST")} className={`flex-1 py-2 font-bold text-center border-b-2 ${activeTab === "LIST" ? "border-[#d3381c] text-white bg-[#25395c]" : "border-transparent"}`}>
                                    🏯 城郭一覧 ({filteredCastles.length})
                                </button>
                                <button onClick={() => setActiveTab("STATS")} className={`flex-1 py-2 font-bold text-center border-b-2 ${activeTab === "STATS" ? "border-[#d3381c] text-white bg-[#25395c]" : "border-transparent"}`}>
                                    📊 登城達成率
                                </button>
                            </div>

                            {activeTab === "LIST" && (
                                <div className="flex-1 flex flex-col min-h-0 overflow-hidden">
                                    {/* 検索・絞り込み */}
                                    <div className="p-2 bg-[#ebe7df] border-b border-gray-300 space-y-1.5 text-xs shrink-0">
                                        <div className="relative">
                                            <input type="text" placeholder="城名・都道府県で検索..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-7 pr-7 py-1 rounded border border-gray-300 bg-white" />
                                            <span className="absolute left-2 top-1 text-gray-400">🔍</span>
                                            {searchQuery && <button onClick={() => setSearchQuery("")} className="absolute right-2 top-1 text-gray-400">✕</button>}
                                        </div>
                                        <div className="grid grid-cols-3 gap-1">
                                            <select value={filterCategory} onChange={e => setFilterCategory(e.target.value)} className="bg-white border rounded p-1 text-[11px]">
                                                <option value="ALL">全名城 (200)</option>
                                                <option value="100名城">100名城</option>
                                                <option value="続100名城">続100名城</option>
                                            </select>
                                            <select value={filterVisited} onChange={e => setFilterVisited(e.target.value)} className="bg-white border rounded p-1 text-[11px]">
                                                <option value="ALL">すべて</option>
                                                <option value="VISITED">登城済 🚩</option>
                                                <option value="UNVISITED">未登城 ⚪</option>
                                            </select>
                                            <select value={filterRegion} onChange={e => setFilterRegion(e.target.value)} className="bg-white border rounded p-1 text-[11px]">
                                                <option value="ALL">全地域</option>
                                                <option value="北海道・東北">北海道・東北</option>
                                                <option value="関東・甲信越">関東・甲信越</option>
                                                <option value="東海・北陸">東海・北陸</option>
                                                <option value="近畿">近畿</option>
                                                <option value="中国・四国">中国・四国</option>
                                                <option value="九州・沖縄">九州・沖縄</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* カードリスト（スクロール領域） */}
                                    <div className="flex-1 overflow-y-auto p-2 space-y-2 min-h-0">
                                        {filteredCastles.map(castle => {
                                            const is100 = castle.category === "100名城";
                                            const isSelected = selectedCastle && selectedCastle.id === castle.id;
                                            return (
                                                <div key={castle.id} onClick={() => handleSelectCastle(castle)} className={`p-2.5 rounded-lg border transition-all cursor-pointer flex items-center justify-between ${castle.isVisited ? 'bg-[#fffcf7] border-[#d3381c]/40' : 'bg-white border-gray-200'} ${isSelected ? 'ring-2 ring-[#c5a059]' : ''}`}>
                                                    <div className="flex items-center space-x-2.5">
                                                        <button onClick={(e) => handleToggleVisited(castle, e)} className={`w-5 h-5 rounded flex items-center justify-center text-xs font-bold ${castle.isVisited ? 'bg-[#d3381c] text-white' : 'bg-gray-100 text-gray-400 border'}`}>
                                                            {castle.isVisited ? "✓" : ""}
                                                        </button>
                                                        <div>
                                                            <div className="flex items-center space-x-1">
                                                                <span className={`text-[9px] px-1 rounded font-bold text-white ${is100 ? 'bg-[#1b2a47]' : 'bg-[#5b6b8c]'}`}>No.{castle.id}</span>
                                                                <span className="text-[10px] text-gray-500">{castle.pref}</span>
                                                            </div>
                                                            <div className="font-mincho font-bold text-sm text-[#1b2a47]">{castle.name}</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-1 text-xs">
                                                        {castle.stampPhoto && <span>💮</span>}
                                                        {castle.castlePhoto && <span>📷</span>}
                                                        {castle.memo && <span>📝</span>}
                                                        <span className="text-gray-400 ml-1">›</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {/* 最下部のスクロール見切れ防止用パディング */}
                                        <div className="h-16 w-full shrink-0"></div>
                                    </div>
                                </div>
                            )}

                            {activeTab === "STATS" && (
                                <div className="flex-1 overflow-y-auto p-3 space-y-3 text-xs min-h-0">
                                    <div className="bg-white p-3 rounded-lg border space-y-2">
                                        <h3 className="font-mincho font-bold text-xs border-b pb-1">進捗状況</h3>
                                        <div>100名城: {stats.c100V}/{stats.c100Total} ({Math.round((stats.c100V/stats.c100Total)*100)}%)</div>
                                        <div>続100名城: {stats.c200V}/{stats.c200Total} ({Math.round((stats.c200V/stats.c200Total)*100)}%)</div>
                                    </div>
                                    <div className="bg-[#ebe7df] p-3 rounded-lg border space-y-2">
                                        <div className="font-bold">データ管理</div>
                                        <div className="flex gap-2">
                                            <button onClick={handleExport} className="flex-1 bg-[#1b2a47] text-white py-1.5 rounded font-bold">JSON出力</button>
                                            <label className="flex-1 bg-white border text-center py-1.5 rounded font-bold cursor-pointer">
                                                JSON復元
                                                <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                                            </label>
                                        </div>
                                    </div>
                                    <div className="h-16 w-full shrink-0"></div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* 入力モーダル */}
                    {selectedCastle && (
                        <CastleEditModal 
                            castle={selectedCastle} 
                            onClose={() => setSelectedCastle(null)}
                            onSave={handleSaveRecord}
                        />
                    )}
                </div>
            );
        }

        // 入力用モーダルコンポーネント（縦全画面スクロール保証設計）
        function CastleEditModal({ castle, onClose, onSave }) {
            const [isVisited, setIsVisited] = useState(castle.isVisited || false);
            const [date, setDate] = useState(castle.date || "");
            const [memo, setMemo] = useState(castle.memo || "");
            const [stampPhoto, setStampPhoto] = useState(castle.stampPhoto || null);
            const [castlePhoto, setCastlePhoto] = useState(castle.castlePhoto || null);
            const [isSaving, setIsSaving] = useState(false);

            const handlePhotoUpload = async (e, setPhotoState, maxPx) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                try {
                    const compressed = await compressImg(file, maxPx);
                    setPhotoState(compressed);
                } catch (err) {
                    alert("画像の読み込みに失敗しました。");
                }
            };

            const handleSubmit = async (e) => {
                if (e) e.preventDefault();
                setIsSaving(true);
                try {
                    const updated = {
                        ...castle,
                        isVisited: Boolean(isVisited),
                        date: isVisited ? (date || new Date().toISOString().split('T')[0]) : "",
                        memo: memo || "",
                        stampPhoto: stampPhoto || null,
                        castlePhoto: castlePhoto || null
                    };
                    await onSave(updated);
                    alert("保存完了しました！");
                    onClose();
                } catch (err) {
                    alert("保存に失敗しました。");
                } finally {
                    setIsSaving(false);
                }
            };

            const is100 = castle.category === "100名城";

            return (
                <div className="fixed inset-0 z-[5000] bg-black/60 flex items-center justify-center p-2 sm:p-4">
                    {/* モーダル枠（スマホ高さ制限＋スクロール領域の分離） */}
                    <div className="bg-[#f7f5f0] w-full max-w-sm rounded-xl shadow-2xl border-2 border-[#c5a059] flex flex-col h-[85vh] max-h-[600px] overflow-hidden">
                        
                        {/* モーダルヘッダー */}
                        <div className="bg-[#1b2a47] text-white p-3 flex items-start justify-between border-b-2 border-[#c5a059] shrink-0">
                            <div>
                                <div className="flex items-center space-x-1.5">
                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${is100 ? 'bg-[#d3381c]' : 'bg-[#5b6b8c]'}`}>
                                        No.{castle.id} {castle.category}
                                    </span>
                                    <span className="text-xs text-[#c5a059]">{castle.pref}</span>
                                </div>
                                <h2 className="font-mincho font-bold text-lg text-[#f7f5f0] mt-0.5">{castle.name}</h2>
                            </div>
                            <button type="button" onClick={onClose} className="text-gray-300 hover:text-white text-lg font-bold p-1">✕</button>
                        </div>

                        {/* モーダルフォーム（内部のみスクロール） */}
                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto p-3 space-y-3 text-xs min-h-0">
                            <div className="bg-white p-2.5 rounded-lg border flex items-center justify-between">
                                <label className="flex items-center space-x-2 cursor-pointer select-none">
                                    <input type="checkbox" checked={isVisited} onChange={e => setIsVisited(e.target.checked)} className="w-5 h-5 accent-[#d3381c]" />
                                    <span className="font-bold text-sm text-[#1b2a47]">この城に登城した 🚩</span>
                                </label>
                            </div>

                            {isVisited && (
                                <div className="space-y-1 bg-white p-2.5 rounded-lg border">
                                    <label className="font-bold text-[#1b2a47] block text-[11px]">登城年月日</label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full border rounded p-1 text-xs bg-gray-50" />
                                </div>
                            )}

                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-white p-2 rounded-lg border text-center">
                                    <span className="font-bold text-[#1b2a47] text-[10px] block mb-1">スタンプ</span>
                                    <div className="w-full h-16 bg-gray-100 rounded border border-dashed flex items-center justify-center relative overflow-hidden">
                                        {stampPhoto ? (
                                            <>
                                                <img src={stampPhoto} alt="スタンプ" className="w-full h-full object-contain p-0.5" />
                                                <button type="button" onClick={() => setStampPhoto(null)} className="absolute top-0.5 right-0.5 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">✕</button>
                                            </>
                                        ) : (
                                            <label className="cursor-pointer w-full h-full flex flex-col items-center justify-center text-gray-400">
                                                <span className="text-base">💮</span>
                                                <span className="text-[9px]">登録</span>
                                                <input type="file" accept="image/*" onChange={e => handlePhotoUpload(e, setStampPhoto, 600)} className="hidden" />
                                            </label>
                                        )}
                                    </div>
                                </div>

                                <div className="bg-white p-2 rounded-lg border text-center">
                                    <span className="font-bold text-[#1b2a47] text-[10px] block mb-1">城郭写真</span>
                                    <div className="w-full h-16 bg-gray-100 rounded border border-dashed flex items-center justify-center relative overflow-hidden">
                                        {castlePhoto ? (
                                            <>
                                                <img src={castlePhoto} alt="写真" className="w-full h-full object-cover" />
                                                <button type="button" onClick={() => setCastlePhoto(null)} className="absolute top-0.5 right-0.5 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">✕</button>
                                            </>
                                        ) : (
                                            <label className="cursor-pointer w-full h-full flex flex-col items-center justify-center text-gray-400">
                                                <span className="text-base">📷</span>
                                                <span className="text-[9px]">登録</span>
                                                <input type="file" accept="image/*" onChange={e => handlePhotoUpload(e, setCastlePhoto, 800)} className="hidden" />
                                            </label>
                                        )}
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-2.5 rounded-lg border space-y-1">
                                <label className="font-bold text-[#1b2a47] block text-[11px]">攻城メモ</label>
                                <textarea rows="2" value={memo} onChange={e => setMemo(e.target.value)} placeholder="見どころ、アクセス、感想..." className="w-full border rounded p-1.5 text-xs"></textarea>
                            </div>

                            {/* モーダル内最下部のマージン */}
                            <div className="h-6 w-full shrink-0"></div>
                        </form>

                        {/* モーダル固定フッター（ボタン） */}
                        <div className="p-2.5 bg-[#ebe7df] border-t flex gap-2 shrink-0">
                            <button type="button" onClick={onClose} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded text-xs">
                                キャンセル
                            </button>
                            <button type="button" onClick={handleSubmit} disabled={isSaving} className="flex-1 bg-[#d3381c] hover:bg-[#b02a12] text-white font-bold py-2 rounded shadow text-xs">
                                {isSaving ? "保存中..." : "保存する"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
