    html, body {

        padding: 0;
        overflow: hidden; /* 全体スクロールを防止 */

    body {
        font-family: 'Zen Kaku Gothic New', sans-serif;

    }
    .font-mincho {

    }
    
    /* モーダルが画面内からはみ出るのを防ぐ設定 */
    .modal-body-scroll {
        max-height: calc(85dvh - 120px);

    }
    
    /* カスタムスクロールバー */
    ::-webkit-scrollbar { width: 6px; height: 6px; }

    ::-webkit-scrollbar-thumb { background: #c5a059; border-radius: 3px; }

        const compressImg = (file, maxPx = 800) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > maxPx || h > maxPx) {
                            if (w > h) {
                                h = Math.round((h * maxPx) / w);
                                w = maxPx;
                            } else {
                                w = Math.round((w * maxPx) / h);
                                h = maxPx;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        function App() {
            const [castles, setCastles] = useState([]);
            const [filterCategory, setFilterCategory] = useState("ALL"); // ALL, 100名城, 続100名城
            const [filterVisited, setFilterVisited] = useState("ALL"); // ALL, VISITED, UNVISITED
            const [filterRegion, setFilterRegion] = useState("ALL");
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedCastle, setSelectedCastle] = useState(null);
            const [activeTab, setActiveTab] = useState("LIST"); // LIST, STATS
            const [sidebarOpen, setSidebarOpen] = useState(true);

            const mapRef = useRef(null);
            const markersRef = useRef({});

            // Initialize IndexedDB Data
            useEffect(() => {
                const initData = async () => {
                    const count = await db.castles.count();
                    if (count === 0) {
                        const initialRecords = MASTER_CASTLES.map(c => ({
                            ...c,
                            isVisited: false,
                            date: "",
                            memo: "",
                            stampPhoto: null,
                            castlePhoto: null
                        }));
                        await db.castles.bulkAdd(initialRecords);
                    }
                    loadCastles();
                };
                initData();
            }, []);

            const loadCastles = async () => {
                const data = await db.castles.toArray();
                setCastles(data);
            };

            // Map Initialization
            useEffect(() => {
                if (!mapRef.current) {
                    const map = L.map('map-container', {
                        zoomControl: false
                    }).setView([37.8, 137.5], 5);

                    L.control.zoom({ position: 'topright' }).addTo(map);

                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(map);

                    mapRef.current = map;
                }
            }, []);

            // Filtered Castle List
            const filteredCastles = useMemo(() => {
                return castles.filter(c => {
                    if (filterCategory !== "ALL" && c.category !== filterCategory) return false;
                    if (filterVisited === "VISITED" && !c.isVisited) return false;
                    if (filterVisited === "UNVISITED" && c.isVisited) return false;
                    if (filterRegion !== "ALL" && c.region !== filterRegion) return false;
                    if (searchQuery.trim() !== "") {
                        const q = searchQuery.toLowerCase();
                        return c.name.toLowerCase().includes(q) || c.pref.toLowerCase().includes(q) || c.id.toString() === q;
                    }
                    return true;
                });
            }, [castles, filterCategory, filterVisited, filterRegion, searchQuery]);

            // Update Map Pins
            useEffect(() => {
                if (!mapRef.current || castles.length === 0) return;

                // Clear previous markers
                Object.values(markersRef.current).forEach(m => mapRef.current.removeLayer(m));
                markersRef.current = {};

                filteredCastles.forEach(castle => {
                    const isVisited = castle.isVisited;
                    const is100 = castle.category === "100名城";

                    // Custom SVG Pin Icon
                    const pinColor = isVisited ? "#d3381c" : (is100 ? "#1b2a47" : "#5b6b8c");
                    const strokeColor = isVisited ? "#f7f5f0" : "#c5a059";
                    const badgeText = is100 ? "100" : "続";

                    const customIcon = L.divIcon({
                        className: "castle-marker",
                        html: `
                            <div style="position: relative; width: 32px; height: 38px; cursor: pointer;">
                                <svg viewBox="0 0 36 46" width="32" height="38" style="filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));">
                                    <path d="M18 0 C8.06 0 0 8.06 0 18 C0 29.25 18 46 18 46 C18 46 36 29.25 36 18 C36 8.06 27.94 0 18 0 Z" fill="${pinColor}" stroke="${strokeColor}" stroke-width="2"/>
                                    <!-- Castle Gate / Tower Silhouette -->
                                    <path d="M11 20 L11 15 L14 15 L14 17 L16 17 L16 13 L20 13 L20 17 L22 17 L22 15 L25 15 L25 20 Z" fill="#ffffff" opacity="0.9"/>
                                </svg>
                                <span style="position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);">${badgeText}</span>
                            </div>
                        `,
                        iconSize: [32, 38],
                        iconAnchor: [16, 38]
                    });

                    const marker = L.marker([castle.lat, castle.lng], { icon: customIcon }).addTo(mapRef.current);

                    marker.on('click', () => {
                        setSelectedCastle(castle);
                    });

                    markersRef.current[castle.id] = marker;
                });
            }, [filteredCastles, castles]);

            // Fly to castle location on selection
            const handleSelectCastle = (castle) => {
                setSelectedCastle(castle);
                if (mapRef.current) {
                    mapRef.current.flyTo([castle.lat, castle.lng], 11, { duration: 1.2 });
                }
            };

            // Save / Toggle Visited Record
            const handleSaveRecord = async (updatedData) => {
                await db.castles.update(updatedData.id, updatedData);
                await loadCastles();
                setSelectedCastle(updatedData);
            };

            // Toggle visited checkbox directly
            const handleToggleVisited = async (castle, e) => {
                e.stopPropagation();
                const newVisited = !castle.isVisited;
                const today = newVisited ? new Date().toISOString().split('T')[0] : "";
                const updated = { ...castle, isVisited: newVisited, date: castle.date || today };
                await db.castles.update(castle.id, updated);
                await loadCastles();
                if (selectedCastle && selectedCastle.id === castle.id) {
                    setSelectedCastle(updated);
                }
            };

            // Stats calculation
            const stats = useMemo(() => {
                const c100 = castles.filter(c => c.category === "100名城");
                const c100V = c100.filter(c => c.isVisited).length;

                const c200 = castles.filter(c => c.category === "続100名城");
                const c200V = c200.filter(c => c.isVisited).length;

                const regions = ["北海道・東北", "関東・甲信越", "東海・北陸", "近畿", "中国・四国", "九州・沖縄"];
                const regionStats = regions.map(reg => {
                    const list = castles.filter(c => c.region === reg);
                    const visited = list.filter(c => c.isVisited).length;
                    return { name: reg, total: list.length, visited };
                });

                return {
                    totalVisited: c100V + c200V,
                    totalAll: castles.length,
                    c100V, c100Total: c100.length,
                    c200V, c200Total: c200.length,
                    regionStats
                };
            }, [castles]);

            // Export Data
            const handleExport = async () => {
                const data = await db.castles.toArray();
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Japan_100_Castles_Backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            // Import Data
            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (Array.isArray(imported) && imported.length > 0) {
                            if (window.confirm("現在のデータを上書き復元しますか？")) {
                                await db.castles.clear();
                                await db.castles.bulkAdd(imported);
                                await loadCastles();
                                alert("データ復元が完了しました！");
                            }
                        } else {
                            alert("無効なバックアップデータです。");
                        }
                    } catch (err) {
                        alert("ファイルの読み込みに失敗しました。");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="w-full h-full flex flex-col md:flex-row relative overflow-hidden">
                    {/* Header bar (Mobile & Desktop) */}
                    <header className="bg-[#1b2a47] text-white px-4 py-2 flex items-center justify-between border-b-2 border-[#c5a059] z-20 shadow-md">
                        <div className="flex items-center space-x-3">
                            <span className="text-2xl">🏯</span>
                            <div>
                                <h1 className="font-mincho font-bold text-lg leading-tight text-[#f7f5f0]">日本100名城 MAP</h1>
                                <p className="text-xs text-[#c5a059]">スタンプラリー & 登城記録帳</p>
                            </div>
                        </div>

                        {/* Top quick stats badge */}
                        <div className="flex items-center space-x-2 text-xs">
                            <div className="bg-[#0f1829] px-3 py-1.5 rounded border border-[#c5a059]/40 flex items-center space-x-2">
                                <span className="text-gray-300">達成率:</span>
                                <span className="font-bold text-[#c5a059] text-sm">
                                    {stats.totalVisited} / {stats.totalAll}
                                </span>
                                <span className="text-gray-400">
                                    ({Math.round((stats.totalVisited / (stats.totalAll || 1)) * 100)}%)
                                </span>
                            </div>

                            <button 
                                onClick={() => setSidebarOpen(!sidebarOpen)} 
                                className="md:hidden bg-[#c5a059] text-[#1b2a47] px-2.5 py-1.5 rounded font-bold"
                            >
                                {sidebarOpen ? "地図優先" : "一覧表示"}
                            </button>
                        </div>
                    </header>

                    {/* Main Container */}
                    <div className="flex-1 flex flex-col md:flex-row h-[calc(100vh-53px)] relative overflow-hidden">
                        
                        {/* Leaflet Map Section */}
                        <div className={`flex-1 h-full relative z-0 ${sidebarOpen ? 'h-[45vh] md:h-full' : 'h-full'}`}>
                            <div id="map-container" className="w-full h-full bg-[#e5e3df]"></div>

                            {/* Floating Map Legend */}
                            <div className="absolute bottom-4 left-4 bg-white/90 backdrop-blur-md p-2.5 rounded-lg shadow-lg border border-[#c5a059]/30 text-xs z-[1000] hidden sm:block">
                                <div className="font-bold text-[#1b2a47] mb-1.5 border-b pb-1 border-gray-200">凡例 (マーカー)</div>
                                <div className="space-y-1">
                                    <div className="flex items-center space-x-2">
                                        <span className="w-3 h-3 rounded-full bg-[#d3381c] border border-white inline-block"></span>
                                        <span>登城済み城郭</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="w-3 h-3 rounded-full bg-[#1b2a47] border border-white inline-block"></span>
                                        <span>日本100名城 (未登城)</span>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="w-3 h-3 rounded-full bg-[#5b6b8c] border border-white inline-block"></span>
                                        <span>続日本100名城 (未登城)</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Sidebar / Panel Container */}
                        <div className={`w-full md:w-[420px] bg-[#f7f5f0] flex flex-col border-t-4 md:border-t-0 md:border-l-2 border-[#c5a059] z-10 shadow-2xl transition-all duration-300 ${sidebarOpen ? 'h-[55vh] md:h-full' : 'hidden md:flex md:h-full'}`}>
                            
                            {/* Panel Navigation Tabs */}
                            <div className="flex bg-[#1b2a47] text-gray-300 text-xs border-b border-[#c5a059]/30">
                                <button 
                                    onClick={() => setActiveTab("LIST")} 
                                    className={`flex-1 py-2.5 font-bold text-center border-b-2 transition-colors ${activeTab === "LIST" ? "border-[#d3381c] text-white bg-[#25395c]" : "border-transparent hover:bg-[#223352]"}`}
                                >
                                    🏯 城郭一覧 ({filteredCastles.length})
                                </button>
                                <button 
                                    onClick={() => setActiveTab("STATS")} 
                                    className={`flex-1 py-2.5 font-bold text-center border-b-2 transition-colors ${activeTab === "STATS" ? "border-[#d3381c] text-white bg-[#25395c]" : "border-transparent hover:bg-[#223352]"}`}
                                >
                                    📊 登城達成率
                                </button>
                            </div>

                            {/* TAB 1: LIST & SEARCH */}
                            {activeTab === "LIST" && (
                                <div className="flex-1 flex flex-col min-h-0 overflow-hidden">
                                    
                                    {/* Search & Filters */}
                                    {}
                                    <div className="p-3 bg-[#ebe7df] border-b border-gray-300 space-y-2 text-xs">
                                        <div className="relative">
                                            <input 
                                                type="text"
                                                placeholder="城名・都道府県で検索..."
                                                value={searchQuery}
                                                onChange={e => setSearchQuery(e.target.value)}
                                                className="w-full pl-8 pr-3 py-1.5 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#c5a059] bg-white"
                                            />
                                            <span className="absolute left-2.5 top-1.5 text-gray-400">🔍</span>
                                            {searchQuery && (
                                                <button onClick={() => setSearchQuery("")} className="absolute right-2.5 top-1.5 text-gray-400 hover:text-black">✕</button>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-3 gap-1.5">
                                            {/* Category filter */}
                                            <select 
                                                value={filterCategory} 
                                                onChange={e => setFilterCategory(e.target.value)}
                                                className="bg-white border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-[#c5a059]"
                                            >
                                                <option value="ALL">全名城 (200)</option>
                                                <option value="100名城">日本100名城</option>
                                                <option value="続100名城">続日本100名城</option>
                                            </select>

                                            {/* Visited filter */}
                                            <select 
                                                value={filterVisited} 
                                                onChange={e => setFilterVisited(e.target.value)}
                                                className="bg-white border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-[#c5a059]"
                                            >
                                                <option value="ALL">登城状況: 全て</option>
                                                <option value="VISITED">登城済み 🚩</option>
                                                <option value="UNVISITED">未登城 ⚪</option>
                                            </select>

                                            {/* Region filter */}
                                            <select 
                                                value={filterRegion} 
                                                onChange={e => setFilterRegion(e.target.value)}
                                                className="bg-white border border-gray-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-[#c5a059]"
                                            >
                                                <option value="ALL">地方: 全地域</option>
                                                <option value="北海道・東北">北海道・東北</option>
                                                <option value="関東・甲信越">関東・甲信越</option>
                                                <option value="東海・北陸">東海・北陸</option>
                                                <option value="近畿">近畿</option>
                                                <option value="中国・四国">中国・四国</option>
                                                <option value="九州・沖縄">九州・沖縄</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Castle Cards List */}
                                    <div className="flex-1 overflow-y-auto p-3 space-y-2 pb-12">
                                        {filteredCastles.length === 0 ? (
                                            <div className="text-center py-10 text-gray-500 text-xs">
                                                条件に合う城郭が見つかりませんでした。
                                            </div>
                                        ) : (
                                            filteredCastles.map(castle => {
                                                const is100 = castle.category === "100名城";
                                                const isSelected = selectedCastle && selectedCastle.id === castle.id;

                                                return (
                                                    <div 
                                                        key={castle.id}
                                                        onClick={() => handleSelectCastle(castle)}
                                                        className={`p-3 rounded-lg border transition-all cursor-pointer flex items-center justify-between ${
                                                            castle.isVisited 
                                                                ? 'bg-[#fffcf7] border-[#d3381c]/40 hover:border-[#d3381c]' 
                                                                : 'bg-white border-gray-200 hover:border-[#c5a059]'
                                                        } ${isSelected ? 'ring-2 ring-[#c5a059] shadow-md' : 'shadow-sm'}`}
                                                    >
                                                        <div className="flex items-center space-x-3">
                                                            {/* Checkbox */}
                                                            <button 
                                                                onClick={(e) => handleToggleVisited(castle, e)}
                                                                className={`w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition-colors ${
                                                                    castle.isVisited 
                                                                        ? 'bg-[#d3381c] text-white border border-[#d3381c]' 
                                                                        : 'bg-gray-100 text-gray-400 border border-gray-300 hover:bg-gray-200'
                                                                }`}
                                                                title={castle.isVisited ? "登城解除" : "登城済みにする"}
                                                            >
                                                                {castle.isVisited ? "✓" : ""}
                                                            </button>

                                                            <div>
                                                                <div className="flex items-center space-x-1.5">
                                                                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold text-white ${is100 ? 'bg-[#1b2a47]' : 'bg-[#5b6b8c]'}`}>
                                                                        No.{castle.id} {castle.category}
                                                                    </span>
                                                                    <span className="text-xs text-gray-500">{castle.pref}</span>
                                                                </div>
                                                                <div className="font-mincho font-bold text-base text-[#1b2a47] mt-0.5">
                                                                    {castle.name}
                                                                </div>
                                                                {castle.isVisited && castle.date && (
                                                                    <div className="text-[11px] text-[#d3381c] mt-0.5 font-medium">
                                                                        🚩 登城日: {castle.date}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        {/* Thumbnail preview indicators */}
                                                        <div className="flex items-center space-x-1">
                                                            {castle.stampPhoto && <span title="スタンプ写真あり" className="text-xs">💮</span>}
                                                            {castle.castlePhoto && <span title="城郭写真あり" className="text-xs">📷</span>}
                                                            {castle.memo && <span title="メモあり" className="text-xs">📝</span>}
                                                            <span className="text-gray-400 text-sm ml-1">›</span>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* TAB 2: STATISTICS & DASHBOARD */}
                            {}
                            {activeTab === "STATS" && (
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
                                    
                                    {/* Overall Progress */}
                                    <div className="bg-white p-4 rounded-lg border border-[#c5a059]/40 shadow-sm space-y-3">
                                        <h3 className="font-mincho font-bold text-sm text-[#1b2a47] border-b pb-1">総達成ステータス</h3>

                                        {/* 日本100名城 Progress */}
                                        <div className="space-y-1">
                                            <div className="flex justify-between font-bold">
                                                <span className="text-[#1b2a47]">日本100名城</span>
                                                <span className="text-[#d3381c]">{stats.c100V} / {stats.c100Total} ({Math.round((stats.c100V / stats.c100Total) * 100)}%)</span>
                                            </div>
                                            <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                                                <div 
                                                    className="h-full bg-[#d3381c] transition-all duration-500" 
                                                    style={{ width: `${(stats.c100V / stats.c100Total) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        {/* 続日本100名城 Progress */}
                                        <div className="space-y-1 pt-1">
                                            <div className="flex justify-between font-bold">
                                                <span className="text-[#5b6b8c]">続日本100名城</span>
                                                <span className="text-[#d3381c]">{stats.c200V} / {stats.c200Total} ({Math.round((stats.c200V / stats.c200Total) * 100)}%)</span>
                                            </div>
                                            <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                                                <div 
                                                    className="h-full bg-[#5b6b8c] transition-all duration-500" 
                                                    style={{ width: `${(stats.c200V / stats.c200Total) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Regional Progress Breakdown */}
                                    <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm space-y-3">
                                        <h3 className="font-mincho font-bold text-sm text-[#1b2a47] border-b pb-1">地方別 登城状況</h3>
                                        <div className="space-y-2.5">
                                            {stats.regionStats.map(reg => {
                                                const pct = Math.round((reg.visited / (reg.total || 1)) * 100);
                                                return (
                                                    <div key={reg.name} className="space-y-1">
                                                        <div className="flex justify-between text-gray-700">
                                                            <span className="font-medium">{reg.name}</span>
                                                            <span className="font-bold text-[#1b2a47]">{reg.visited} / {reg.total} ({pct}%)</span>
                                                        </div>
                                                        <div className="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
                                                            <div 
                                                                className="h-full bg-[#c5a059] transition-all duration-300"
                                                                style={{ width: `${pct}%` }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Backup & Restore Data Management */}
                                    <div className="bg-[#ebe7df] p-3 rounded-lg border border-gray-300 space-y-2">
                                        <div className="font-bold text-[#1b2a47] text-xs">💾 データ管理（バックアップ）</div>
                                        <p className="text-[11px] text-gray-600">
                                            登録した登城日、写真、メモなどの記録をJSONファイルとしてダウンロード・復元できます。
                                        </p>
                                        <div className="flex gap-2 pt-1">
                                            <button 
                                                onClick={handleExport}
                                                className="flex-1 bg-[#1b2a47] hover:bg-[#283e68] text-white py-1.5 rounded font-bold transition-colors text-center"
                                            >
                                                JSON出力
                                            </button>
                                            <label className="flex-1 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 py-1.5 rounded font-bold cursor-pointer transition-colors text-center">
                                                JSON復元
                                                <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                </div>
                            )}

                        </div>
                    </div>

                    {/* CASTLE DETAIL / EDIT MODAL POPUP */}
                    {}
                    {selectedCastle && (
                        <CastleModal 
                            castle={selectedCastle} 
                            onClose={() => setSelectedCastle(null)}
                            onSave={handleSaveRecord}
                        />
                    )}
                </div>
            );
        }

        function CastleModal({ castle, onClose, onSave }) {
            const [isVisited, setIsVisited] = useState(castle.isVisited || false);
            const [date, setDate] = useState(castle.date || "");
            const [memo, setMemo] = useState(castle.memo || "");
            const [stampPhoto, setStampPhoto] = useState(castle.stampPhoto || null);
            const [castlePhoto, setCastlePhoto] = useState(castle.castlePhoto || null);
            const [isSaving, setIsSaving] = useState(false);

            // Stamp photo upload handler
            const handleStampUpload = async (e) => {
                if (e.target.files[0]) {
                    const compressed = await compressImg(e.target.files[0], 600);
                    setStampPhoto(compressed);
                }
            };

            // Castle photo upload handler
            const handleCastlePhotoUpload = async (e) => {
                if (e.target.files[0]) {
                    const compressed = await compressImg(e.target.files[0], 800);
                    setCastlePhoto(compressed);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const updated = {
                    ...castle,
                    isVisited,
                    date: isVisited ? (date || new Date().toISOString().split('T')[0]) : "",
                    memo,
                    stampPhoto,
                    castlePhoto
                };
                await onSave(updated);
                setIsSaving(false);
            };

            const is100 = castle.category === "100名城";

            return (
                <div className="fixed inset-0 z-[2000] bg-black/60 backdrop-blur-xs flex items-center justify-center p-2">
        <div className="bg-[#f7f5f0] w-full max-w-[360px] rounded-xl shadow-2xl border-2 border-[#c5a059] overflow-hidden flex flex-col max-h-[85dvh]">
                        
                        {/* Modal Header */}
                        <div className="bg-[#1b2a47] text-white p-4 flex items-start justify-between border-b-2 border-[#c5a059]">
                            <div>
                                <div className="flex items-center space-x-2">
                                    <span className={`text-xs px-2 py-0.5 rounded font-bold ${is100 ? 'bg-[#d3381c]' : 'bg-[#5b6b8c]'}`}>
                                        No.{castle.id} {castle.category}
                                    </span>
                                    <span className="text-xs text-[#c5a059]">{castle.pref} ({castle.region})</span>
                                </div>
                                <h2 className="font-mincho font-bold text-2xl mt-1 text-[#f7f5f0]">{castle.name}</h2>
                            </div>
                            <button 
                                onClick={onClose}
                                className="text-gray-300 hover:text-white text-xl font-bold p-1 leading-none"
                            >
                                ✕
                            </button>
                        </div>

                        {/* Modal Body */}
                        <form onSubmit={handleSubmit} className="p-4 modal-body-scroll space-y-3 text-xs">
                            
                            {/* Visit Toggle Checkbox */}
                            <div className="bg-white p-3 rounded-lg border border-gray-200 flex items-center justify-between">
                                <label className="flex items-center space-x-2 cursor-pointer select-none">
                                    <input 
                                        type="checkbox" 
                                        checked={isVisited} 
                                        onChange={e => setIsVisited(e.target.checked)}
                                        className="w-5 h-5 accent-[#d3381c] rounded cursor-pointer"
                                    />
                                    <span className="font-bold text-sm text-[#1b2a47]">この城郭に登城した 🚩</span>
                                </label>
                            </div>

                            {/* Visit Date */}
                            {isVisited && (
                                <div className="space-y-1 bg-white p-3 rounded-lg border border-gray-200">
                                    <label className="font-bold text-[#1b2a47] block">登城年月日</label>
                                    <input 
                                        type="date" 
                                        value={date} 
                                        onChange={e => setDate(e.target.value)}
                                        className="w-full border border-gray-300 rounded p-2 text-xs bg-gray-50 focus:bg-white focus:outline-none focus:ring-1 focus:ring-[#c5a059]"
                                    />
                                </div>
                            )}

                            {/* Photos Section */}
                            <div className="grid grid-cols-2 gap-3">
                                {/* Stamp Photo */}
                                <div className="bg-white p-2.5 rounded-lg border border-gray-200 flex flex-col items-center text-center">
                                    <span className="font-bold text-[#1b2a47] mb-1.5">100名城スタンプ</span>
                                    <div className="w-full h-20 sm:h-28 bg-gray-100 rounded border border-dashed border-gray-300 flex items-center justify-center relative overflow-hidden group">
                                        {stampPhoto ? (
                                            <>
                                                <img src={stampPhoto} alt="スタンプ" className="w-full h-full object-contain p-1" />
                                                <button 
                                                    type="button" 
                                                    onClick={() => setStampPhoto(null)}
                                                    className="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]"
                                                >
                                                    ✕
                                                </button>
                                            </>
                                        ) : (
                                            <label className="cursor-pointer w-full h-full flex flex-col items-center justify-center text-gray-400 hover:text-gray-600">
                                                <span className="text-2xl">💮</span>
                                                <span className="text-[10px] mt-1">スタンプ登録</span>
                                                <input type="file" accept="image/*" onChange={handleStampUpload} className="hidden" />
                                            </label>
                                        )}
                                    </div>
                                </div>

                                {/* Castle Photo */}
                                <div className="bg-white p-2.5 rounded-lg border border-gray-200 flex flex-col items-center text-center">
                                    <span className="font-bold text-[#1b2a47] mb-1.5">城郭・風景写真</span>
                                    <div className="w-full h-20 sm:h-28 bg-gray-100 rounded border border-dashed border-gray-300 flex items-center justify-center relative overflow-hidden group">
                                        {castlePhoto ? (
                                            <>
                                                <img src={castlePhoto} alt="城郭写真" className="w-full h-full object-cover" />
                                                <button 
                                                    type="button" 
                                                    onClick={() => setCastlePhoto(null)}
                                                    className="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]"
                                                >
                                                    ✕
                                                </button>
                                            </>
                                        ) : (
                                            <label className="cursor-pointer w-full h-full flex flex-col items-center justify-center text-gray-400 hover:text-gray-600">
                                                <span className="text-2xl">📷</span>
                                                <span className="text-[10px] mt-1">写真を追加</span>
                                                <input type="file" accept="image/*" onChange={handleCastlePhotoUpload} className="hidden" />
                                            </label>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Memo Notes */}
                            <div className="bg-white p-3 rounded-lg border border-gray-200 space-y-1">
                                <label className="font-bold text-[#1b2a47] block">攻城メモ / 感想</label>
                                <textarea 
                                    rows="3"
                                    value={memo}
                                    onChange={e => setMemo(e.target.value)}
                                    placeholder="遺構の様子、見どころ、アクセス、旅の思い出など..."
                                    className="w-full border border-gray-300 rounded p-2 text-xs focus:outline-none focus:ring-1 focus:ring-[#c5a059]"
                                ></textarea>
                            </div>

                            {/* Footer Submit */}
                            <div className="pt-2 flex gap-2">
                                <button 
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 rounded transition-colors"
                                >
                                    キャンセル
                                </button>
                                <button 
                                    type="submit"
                                    disabled={isSaving}
                                    className="flex-1 bg-[#d3381c] hover:bg-[#b02a12] text-white font-bold py-2 rounded shadow-md transition-colors"
                                >
                                    {isSaving ? "保存中..." : "記録を保存"}
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
